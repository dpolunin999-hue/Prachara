name: Secure one-time data migration

on:
  push:
    paths:
      - .github/workflows/secure-migrate.yml
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read

jobs:
  generate-key:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Generate short-lived encryption key
        shell: bash
        run: |
          mkdir -p .migration-key
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out .migration-key/private.pem
          openssl pkey -in .migration-key/private.pem -pubout -out .migration-key/public.pem
      - name: Save key for the one-time migration
        uses: actions/upload-artifact@v4
        with:
          name: migration-keypair
          path: .migration-key
          retention-days: 1
          if-no-files-found: error
      - name: Publish safe public key
        shell: bash
        run: |
          echo "MIGRATION_PUBLIC_KEY_BEGIN"
          cat .migration-key/public.pem
          echo "MIGRATION_PUBLIC_KEY_END"

  migrate:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == 'dpolunin999-hue' &&
      github.event.issue.title == '[secure-migration] mubm88hycb1ql4fuu1wvbg1vpo392'
    runs-on: ubuntu-latest
    steps:
      - name: Read encrypted envelope metadata
        id: envelope
        shell: bash
        env:
          MIGRATION_ENVELOPE: ${{ github.event.issue.body }}
        run: |
          RUN_ID="$(node -e 'const x=JSON.parse(process.env.MIGRATION_ENVELOPE); if(!x.runId) process.exit(2); process.stdout.write(String(x.runId))')"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Download short-lived private key
        uses: actions/download-artifact@v4
        with:
          name: migration-keypair
          path: .migration-key
          run-id: ${{ steps.envelope.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Check out migration runner
        uses: actions/checkout@v4
      - name: Run encrypted migration
        env:
          MIGRATION_ENVELOPE: ${{ github.event.issue.body }}
        run: node .github/scripts/secure-migrate.mjs
