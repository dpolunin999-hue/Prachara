name: Secure one-time data migration

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  migrate:
    if: >-
      github.event.issue.user.login == 'dpolunin999-hue' &&
      github.event.issue.title == '[secure-migration] mubmghwylh0m3w8nbz6q1rjr6ldha'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out migration runner
        uses: actions/checkout@v4
      - name: Generate in-memory encryption key
        shell: bash
        run: |
          mkdir -p .migration-key
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out .migration-key/private.pem
          openssl pkey -in .migration-key/private.pem -pubout -out .migration-key/public.pem
      - name: Publish safe public key to the protected issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BODY="$(printf 'MIGRATION_PUBLIC_KEY\n%s' "$(cat .migration-key/public.pem)")"
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/public-key-comment.json"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            --data-binary "@$RUNNER_TEMP/public-key-comment.json" > /dev/null
      - name: Wait for owner-encrypted migration envelope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OWNER_LOGIN: dpolunin999-hue
        run: |
          for attempt in $(seq 1 90); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" \
              > "$RUNNER_TEMP/comments.json"
            BODY="$(jq -r --arg owner "$OWNER_LOGIN" \
              '[.[] | select(.user.login == $owner and (.body | startswith("MIGRATION_ENVELOPE\\n")))] | last | .body // "" | sub("^MIGRATION_ENVELOPE\\n"; "")' \
              "$RUNNER_TEMP/comments.json")"
            if [ -n "$BODY" ]; then
              printf '%s' "$BODY" > "$RUNNER_TEMP/envelope.json"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for encrypted migration data" >&2
          exit 1
      - name: Run migration
        shell: bash
        run: |
          MIGRATION_ENVELOPE="$(cat "$RUNNER_TEMP/envelope.json")" \
            node .github/scripts/secure-migrate.mjs
      - name: Confirm completion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          jq -n --arg body "MIGRATION_COMPLETED" '{body:$body}' > "$RUNNER_TEMP/completed-comment.json"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            --data-binary "@$RUNNER_TEMP/completed-comment.json" > /dev/null
